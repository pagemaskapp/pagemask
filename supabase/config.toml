# Configuracao do Supabase Auth — a parte que DA para versionar.
#
# Este arquivo governa o `supabase start` (stack local). O projeto hospedado
# continua sendo configurado no painel: o que esta aqui e a fonte da verdade do
# que precisa estar la, e o README repete a lista em "Configurar o Supabase Auth".
#
# O que ele existe para fixar, e que antes so vivia no painel:
#
#   · o template de confirmacao manda `{{ .Token }}` (codigo de 6 digitos) em
#     vez de link. Sem isso, `/confirme-seu-email` mostra um campo de codigo
#     para quem recebeu um link — e nada funciona;
#   · o template de recuperacao manda link, de proposito (o porque esta no
#     proprio arquivo);
#   · confirmacao de e-mail LIGADA e senha minima de 10, que sao as duas travas
#     do PLANO §1.

project_id = "pagemask"

[auth]
enabled = true
# Vale para o `supabase start`. Em producao e a Site URL do painel.
site_url = "http://localhost:3000"
# O `**` no fim nao e enfeite: os links saem com `?proximo=…`, a comparacao do
# Supabase e glob sobre a URL INTEIRA, e `*` so casa ate o proximo `/`.
additional_redirect_urls = ["http://localhost:3000/auth/confirmar**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Espelha `TAMANHO_MINIMO_SENHA` em `app/src/lib/auth/formulario.ts`. O app ja
# valida no servidor; ligar aqui fecha o caminho de quem chamar a API direto.
minimum_password_length = 10

[auth.email]
enable_signup = true
# PLANO §1: sem isto, `signUp` ja devolve sessao e qualquer um cria conta com
# e-mail alheio.
enable_confirmations = true
double_confirm_changes = true
# Trocar a senha exige ter entrado ha pouco (24h). A sessao de recuperacao
# acabou de nascer do link, entao ela passa — verificado no fonte do GoTrue,
# `internal/api/user.go`: a reautenticacao so e cobrada quando
# `session == nil || now.After(session.CreatedAt.Add(24*time.Hour))`, e o fluxo
# de recuperacao tem isencao propria. O que isso fecha e a sessao ANTIGA: um
# cookie roubado de semanas atras nao troca a senha da conta.
secure_password_change = true
# Espelha `TAMANHO_DO_CODIGO` no mesmo arquivo. Mudar um sem o outro faz o
# formulario recusar, antes de qualquer viagem, o codigo que o usuario recebeu.
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Seu código de confirmação do PageMask"
content_path = "./supabase/templates/confirmacao.html"

[auth.email.template.recovery]
subject = "Criar uma senha nova no PageMask"
content_path = "./supabase/templates/recuperacao.html"
